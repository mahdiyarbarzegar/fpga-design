name: log2

type: hdl

ip:
  vlnv: user.org:user_ip:log2:0.1
  vendor: user.org
  library: user_ip
  name: log2
  version: 0.1
  taxonomy: /UserIP
  display_name: Logarithm 2
  description: Logarithm 2 Calculator IP
  top_module: log2_w

package:
  append: ip/package_append.tcl

rtl:
  - rtl/log2_pkg_utils.vhd
  - rtl/log2_fp_lut_gen.vhd
  - rtl/log2_fp_lut_gen_dual_port.vhd
  - rtl/log2_dsp_slice.vhd
  - rtl/log2_fp_lut_core.vhd
  - rtl/log2_fp_lut_lintrpl_core.vhd
  - rtl/log2_w.vhd

include:

constraints:
  - constr/package.xdc

dependencies:
  lib:
  module:
    - name: lopd
      consume: rtl
      variant:

simulation:
  batch:
    top: tb_log2_lut
    snapshot: log2_lut_batch
    consume: rtl
    variant:
    files:
      - sim/tb_log2_lut.vhd
    dependencies:
      lib:
      module:
    timescale: 1ns/1ps
    tclbatch:
    waveform:
    xvlog_opts: [ ]
    xelab_opts: [ ]
    xsim_opts:
  gui:
    top: gui_log2_lut
    snapshot: log2_lut_gui
    consume: rtl
    variant:
    files:
      - sim/gui_log2_lut.vhd
    dependencies:
      lib:
      module:
    timescale: 1ns/1ps
    tclbatch: gui/gui_sim.tcl
    waveform: gui/log2_lut_gui.wcfg
    xvlog_opts:
    xelab_opts:
    xsim_opts:

variants:
  log2_iq16_8_of8:
    name: log2_iq16_8_of8
    display_name: Log2 IP with Input Q16_8, 8-bit Out Fraction, and 7-bit LUT Address
    parameters:
      CONFIG.STRATEGY: "LUT"
      CONFIG.USE_DSP: false
      CONFIG.INPUT_DATA_WIDTH: 16
      CONFIG.INPUT_FRACTION_WIDTH: 8
      CONFIG.LUT_ADDR_SIZE: 7

  log2_iq16_8_of8_lintrpl:
    name: log2_iq16_8_of8_lintrpl
    display_name: Log2 IP with Input Q16_8, 8-bit Out Fraction, 6-bit LUT Address, and Linear Interpolation
    parameters:
      CONFIG.STRATEGY: "LUT_LINEAR_INTRPL"
      CONFIG.USE_DSP: true
      CONFIG.INPUT_DATA_WIDTH: 16
      CONFIG.INPUT_FRACTION_WIDTH: 8
      CONFIG.LUT_ADDR_SIZE: 7

interfaces:
  clk:
    type: clock
    frequency: 100000000
    port:
      clk: clk

  rst_n:
    type: reset
    polarity: active_low
    port:
      rst_n: rst_n

  data_i:
    type: input
    port:
      data_i: data_i

  valid_i:
    type: input
    port:
      valid_i: valid_i

  data_o:
    type: output
    port:
      data_o: data_o

  valid_o:
    type: output
    port:
      valid_o: valid_o

parameters:
  STRATEGY:
    type: string
    resolve: user
    default: LUT
    validation:
      type: list
      values:
        - LUT
        - LUT_LINEAR_INTRPL
    gui:
      display_name: Strategy
      widget: dropdown
      page: General
      group: Logarithm_2

  USE_DSP:
    type: boolean
    resolve: user
    default: false
    enablement: 'expr {$STRATEGY == "LUT_LINEAR_INTRPL"}'
    gui:
      display_name: USE DSP
      widget: checkbox
      page: General
      group: Logarithm_2

  INPUT_DATA_WIDTH:
    type: integer
    resolve: user
    default: 16
    validation:
      type: range_long
      min: 8
      max: 64
    gui:
      display_name: Input Data Width
      page: General
      group: Logarithm_2

  INPUT_FRACTION_WIDTH:
    type: integer
    resolve: user
    default: 8
    validation:
      type: range_long
      min: 2
      max: 32
    gui:
      display_name: Input Fraction Width
      page: General
      group: Logarithm_2

  OUTPUT_FRACTION_WIDTH:
    type: integer
    resolve: user
    default: 8
    validation:
      type: range_long
      min: 2
      max: 32
    gui:
      display_name: Output Fraction Width
      page: General
      group: Logarithm_2

  LUT_ADDR_SIZE:
    type: integer
    resolve: user
    default: 7
    validation:
      type: range_long
      min: 4
      max: 16
    gui:
      display_name: Lookup Table Adders Size
      page: General
      group: Logarithm_2

  OUTPUT_DATA_WIDTH:
    type: integer
    resolve: dependent
    expression: 'expr {
        $OUTPUT_FRACTION_WIDTH +
        max(
            ceil(log($INPUT_FRACTION_WIDTH)/log(2)) + 1,
            ceil(log(
                    log(
                        pow(2, $INPUT_DATA_WIDTH - $INPUT_FRACTION_WIDTH)
                        - (1.0 / pow(2, $INPUT_FRACTION_WIDTH))
                    )/log(2)
                    + (1.0 / pow(2, $OUTPUT_FRACTION_WIDTH))
                )/log(2)
            ) + 1
        )
    }'
    gui:
      hidden: true

parameters_constraints:
