name: lopd

type: hdl

ip:
  vlnv: user.org:user_ip:lopd:0.1
  vendor: user.org
  library: user_ip
  name: lopd
  version: 0.1
  taxonomy: /UserIP
  display_name: Leading One Position Detector
  description: Leading One Position Detector
  top_module: lopd

package:
  append: ip/package_append.tcl

rtl:
  - rtl/lopd_slice.vhd
  - rtl/lopd.vhd

include:

constraints:
  - constr/package.xdc

dependencies:
  lib:
  module:
    - name:
      consume:
      variant:

simulation:
  batch:
    top:
    snapshot:
    consume:
    variant:
    files:
    dependencies:
      lib:
      module:
    timescale: 1ns/1ps
    tclbatch:
    waveform:
    xvlog_opts: [ ]
    xelab_opts: [ ]
    xsim_opts:
  gui:
    top: tb_lopd
    snapshot: lopd_gui
    consume: rtl
    variant:
    files:
      - sim/tb_lopd.vhd
    dependencies:
      lib:
      module:
    timescale: 1ns/1ps
    tclbatch: gui/gui_sim.tcl
    waveform: gui/lopd_gui.wcfg
    xvlog_opts: [ ]
    xelab_opts: [ ]
    xsim_opts:

variants:
  lopd_16b:
    name: lopd_16b
    display_name: Leading One Position Detector 16bit
    parameters:
      CONFIG.INPUT_DATA_WIDTH: 16
      CONFIG.LOPD_SLICE_DATA_WIDTH: 8

interfaces:
  clk:
    type: clock
    frequency: 100000000
    port:
      clk: clk

  rst_n:
    type: reset
    polarity: active_low
    port:
      rst_n: rst_n

  d_i:
    type: input
    port:
      d_i: d_i

  d_o:
    type: output
    port:
      d_o: d_o

  z_o:
    type: output
    port:
      z_o: z_o

parameters:
  INPUT_DATA_WIDTH:
    type: integer
    resolve: user
    default: 16
    validation:
      type: range_long
      min: 8
      max: 64
    gui:
      display_name: Data Width
      page: General
      group: LOPD

  LOPD_SLICE_DATA_WIDTH:
    type: integer
    resolve: user
    default: 8
    validation:
      type: list
      values:
        - 4
        - 8
        - 16
    gui:
      display_name: LOPD Slice Data Width
      page: General
      group: LOPD

  OUTPUT_DATA_WIDTH:
    type: integer
    resolve: dependent
    expression: 'expr { ceil(log($INPUT_DATA_WIDTH - 1)/log(2)) }'
    gui:
      hidden: true

