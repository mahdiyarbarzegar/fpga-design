name: booth_multiplier

type: hdl

ip:
  vlnv: user.org:user_ip:booth_multiplier:0.1
  vendor: user.org
  library: user_ip
  name: booth_multiplier
  version: 0.1
  taxonomy: /UserIP
  display_name: Booth Multiplier
  description: A booth sequential multiplier
  top_module: booth_multiplier_w

package:
  append: ip/package_append.tcl

rtl:
  - rtl/vhdl/booth_multiplier.vhd
  - rtl/vhdl/booth_multiplier_w.vhd

include:

constraints:
  - constr/package.xdc

dependencies: { }

simulation:
  booth_mul_batch:
    top: tb_booth_multiplier
    consume: rtl
    variant:
    files:
      - sim/tb_booth_multiplier.v
    dependencies:
      lib:
      module:
    parameters:
      - MUL_SIZE: 4
    timescale: 1ns/1ps
    type: batch
    tclbatch:
    waveform:
    xvlog_opts: [ ]
    xvhdl_opts: [ ]
    xelab_opts: [ ]
    xsim_opts: [ ]
  booth_mul_gui:
    top: gui_booth_multiplier
    consume: rtl
    variant:
    files:
      - sim/gui_booth_multiplier.v
    dependencies:
      lib:
      module:
    parameters:
      - MUL_SIZE: 4
    timescale: 1ns/1ps
    type: gui
    tclbatch: gui/gui_sim.tcl
    waveform: gui/gui_sim.wcfg
    xvlog_opts: [ ]
    xvhdl_opts: [ ]
    xelab_opts: [ ]
    xsim_opts: [ ]

variants:
  booth_mul_32b:
    name: booth_mul_32b
    display_name: Booth Multiplier 32bit
    parameters:
      CONFIG.DATA_WIDTH: 32

  booth_mul_8b:
    name: booth_mul_8b
    display_name: Booth Multiplier 8bit
    parameters:
      CONFIG.DATA_WIDTH: 8
