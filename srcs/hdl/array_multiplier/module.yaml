name: array_multiplier

type: hdl

ip:
  vlnv: user.org:user_ip:array_multiplier:0.1
  vendor: user.org
  library: user_ip
  name: array_multiplier
  version: 0.1
  taxonomy: /UserIP
  display_name: Array Multiplier
  description: An array like combinational multiplier
  top_module: array_multiplier_w

package:
  append: ip/package_append.tcl

rtl:
  - rtl/vhdl/mul_slice.vhd
  - rtl/vhdl/array_multiplier.vhd
  - rtl/vhdl/array_multiplier_w.vhd

include:

constraints:

dependencies:
  lib:
  module:
    - name: full_adder
      consume: rtl
      variant:

simulation:
  array_mul_batch:
    top: tb_array_multiplier
    consume: rtl
    variant:
    files:
      - sim/tb_array_multiplier.v
    dependencies:
      lib:
      module:
    parameters:
    timescale: 1ns/1ps
    type: batch
    tclbatch:
    waveform:
    xvlog_opts: [ ]
    xvhdl_opts: [ ]
    xelab_opts: [ ]
    xsim_opts: [ ]

variants:
  array_mul_32b:
    name: array_mul_32b
    display_name: Array Multiplier 32bit
    parameters:
      CONFIG.DATA_WIDTH: 32

  array_mul_8b:
    name: array_mul_8b
    display_name: Array Multiplier 8bit
    parameters:
      CONFIG.DATA_WIDTH: 8
