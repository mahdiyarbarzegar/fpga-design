name: axi4lite_slave

type: hdl

ip:
  vlnv: user.org:user_ip:axi4lite_slave:0.1
  vendor: user.org
  library: user_ip
  name: axi4lite_slave
  version: 0.1
  taxonomy: /UserIP
  display_name: AXI4-Lite-Slave
  description: AXI4-Lite Slave Bus Interface
  top_module: axi4lite_slave

package: { }

rtl:
  - rtl/axi4lite_slave.sv

include:
  - rtl

constraints:

dependencies:
  lib:
    - axi4lite_bus_ifc
    - axi4_reg
  module:

simulation:
  axi4lite_slave_batch:
    top: tb_axi4lite_slave
    consume: rtl
    variant:
    files:
      - sim/tb_axi4lite_slave.sv
    dependencies:
      lib:
        - axi4_reg_model
        - axi4lite_master_model
      module:
    parameters:
      - AXI_ADDR_WIDTH: 5
      - AXI_DATA_WIDTH: 32
    timescale: 1ns/1ps
    type: batch
    tclbatch:
    waveform:
    xvlog_opts: [ ]
    xvhdl_opts: [ ]
    xelab_opts: [ ]
    xsim_opts: [ ]
  axi4lite_slave_gui:
    top: tb_axi4lite_slave
    consume: rtl
    variant:
    files:
      - sim/tb_axi4lite_slave.sv
    dependencies:
      lib:
        - axi4_reg_model
        - axi4lite_master_model
      module:
    parameters:
      - AXI_ADDR_WIDTH: 5
      - AXI_DATA_WIDTH: 32
    timescale: 1ns/1ps
    type: gui
    tclbatch: gui/gui_sim.tcl
    waveform: gui/gui_sim.wcfg
    xvlog_opts: [ ]
    xvhdl_opts: [ ]
    xelab_opts: [ ]
    xsim_opts: [ ]

variants:
