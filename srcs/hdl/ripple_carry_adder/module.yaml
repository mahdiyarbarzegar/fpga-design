name: ripple_carry_adder

type: hdl

ip:
  vlnv: user.org:user_ip:ripple_carry_adder:0.1
  vendor: user.org
  library: user_ip
  name: ripple_carry_adder
  version: 0.1
  taxonomy: /UserIP
  display_name: Ripple Carry Adder
  description: Ripple Carry Adder
  top_module: ripple_carry_adder_w

package:
  append: ip/package_append.tcl

rtl:
  - rtl/vhdl/ripple_carry_adder.vhd
  - rtl/vhdl/ripple_carry_adder_w.vhd

include:

constraints:

dependencies:
  lib:
  module:
    - name: full_adder
      consume: rtl
      variant:

simulation:
  rca_batch:
    top: tb_ripple_carry_adder
    consume: rtl
    variant:
    files:
      - sim/tb_ripple_carry_adder.vhd
    dependencies:
      lib:
      module:
    parameters:
      - BUS_WIDTH: 8
    timescale: 1ns/1ps
    type: batch
    tclbatch:
    waveform:
    xvlog_opts: [ ]
    xvhdl_opts: [ ]
    xelab_opts: [ ]
    xsim_opts: [ ]
  rca_gui:
    top: gui_ripple_carry_adder
    consume: rtl
    variant:
    files:
      - sim/gui_ripple_carry_adder.v
    dependencies:
      lib:
      module:
    parameters:
      - BUS_WIDTH: 32
    timescale: 1ns/1ps
    type: gui
    tclbatch: gui/gui_sim.tcl
    waveform: gui/gui_sim.wcfg
    xvlog_opts: [ ]
    xvhdl_opts: [ ]
    xelab_opts: [ ]
    xsim_opts: [ ]

variants:
  rca_32b:
    name: rca_32b
    display_name: Ripple Carry Adder 32bit
    parameters:
      CONFIG.BUS_WIDTH: 32
